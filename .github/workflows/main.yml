name: A workflow for my Hello World App
on: push
jobs:
  build:
    name: Hello world action
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'adopt'

      - name: Package with Maven
        run: mvn package

      - name: Create Docker Network
        run: docker network create sem-net

      - name: Run MongoDB Container
        run: docker run --name mongo-db-server --network sem-net -d mongo

      - name: Build Docker Image
        run: docker build -t semethic .

      - name: Run App Container
        run: docker run --name semethic-app --network sem-net -d semethic

      - name: Wait for App Execution
        run: sleep 10

      - name: View Logs
        run: docker logs semethic-app